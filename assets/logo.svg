    <circle cx="156" cy="146" r="20" fill="#7bd389" />
    <rect x="28" y="70" width="160" height="50" rx="12" fill="#7bd389" />
    <rect x="52" y="44" width="72" height="28" rx="8" fill="#7bd389" />
